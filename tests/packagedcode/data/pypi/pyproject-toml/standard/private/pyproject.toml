[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "private-example"
version = "1.0.0"
description = "An example private package that must not be uploaded to PyPI"
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://example.com/private-example"
