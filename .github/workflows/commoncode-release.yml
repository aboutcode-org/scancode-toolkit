name: Create and release commoncode wheels on GitHub and Pypi


# This is executed automatically on a tag in the main branch

# Summary of the steps:
# - build wheels and sdist
# - upload wheels and sdist to PyPI
# - create gh-release and upload wheels and dists there
# TODO: smoke test wheels and sdist
# TODO: add changelog to release text body

# WARNING: this is designed only for packages building as pure Python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "commoncode-v*.*.*"

jobs:
  build-pypi-distribs:
    permissions:
      contents: read # to fetch code (actions/checkout)

    name: Build and publish library to PyPI
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.14

      - name: Install pypa/build and twine
        run: python -m pip install --user --upgrade build twine pkginfo flot

      - name: Install requirements then build main and mini wheel
        run: etc/release/commoncode-create-pypi-wheel-and-sdist.sh

      - name: Upload built archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pypi_archives
          path: dist/*


  create-gh-release:
    permissions:
      contents: write

    name: Create GH release
    needs:
      - build-pypi-distribs
    runs-on: ubuntu-24.04

    steps:
      - name: Download built archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pypi_archives
          path: dist

      - name: Create GH release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          draft: true
          files: dist/*


  create-pypi-release:
    name: Create PyPI release
    needs:
      - create-gh-release
    runs-on: ubuntu-24.04
    environment: pypi-publish
    permissions:
      id-token: write

    steps:
      - name: Download built archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pypi_archives
          path: dist

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086