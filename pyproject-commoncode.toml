[build-system]
requires = [ "flot>=0.7.0" ]
build-backend = "flot.buildapi"

[project]
name = "commoncode"
version = "32.5.2"
authors = [
    { name = "nexB. Inc. and others", email = "info@aboutcode.org" },
]
license = { text = "Apache-2.0" }


# description must be on ONE line https://github.com/pypa/setuptools/issues/1390
description = "Set of common utilities, originally split from ScanCode"
long_description_content_type = "text/x-rst"
readme = "src/commoncode/README.rst"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

keywords = [
    "utilities",
    "scancode-toolkit"
]

metadata_files = [
    "apache-2.0.LICENSE",
    "NOTICE",
    "AUTHORS.rst",
    "CHANGELOG.rst",
    "CODE_OF_CONDUCT.rst",
    "README.rst",
    "commoncode.ABOUT"
]

requires-python = ">=3.10"

dependencies = [
    "attrs >= 18.1,!=20.1.0;python_version<'3.11'",
    "attrs >= 22.1.0;python_version>='3.11'",
    "Beautifulsoup4[chardet] >= 4.13.0",
    "click >= 8.3.0",
    "requests[use_chardet_on_py3] >= 2.7.0",
    "saneyaml >= 0.5.2",
    "text_unidecode >= 1.0"
]

[project.urls]
Homepage = "https://github.com/nexB/scancode-toolkit"

[project.optional-dependencies]
dev = [
    "pytest >= 7.0.1",
    "pytest-xdist >= 2",
    "aboutcode-toolkit >= 11.1.1",
    "pycodestyle >= 2.8.0",
    "twine",
    "ruff",
    "Sphinx>=5.0.2",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-reredirects >= 0.1.2",
    "doc8>=0.11.2",
    "sphinx-autobuild",
    "sphinx-rtd-dark-mode>=1.3.0",
    "sphinx-copybutton"
]

[tool.flot]
wheel_path_prefixes_to_strip = [ "src" ]

includes = [
    "src/commoncode/*",
]

excludes = [
    "docs/build/**/*",

    # Python compiled files
    "**/*.py[cod]",
    "**/*.egg-info",
    # Various junk and temp files
    "**/.DS_Store",
    "**/*~",
    "**/.*.sw[po]",
    "**/.ve",
    "**/*.bak",
    "**/.ipynb_checkpoints",
]

metadata_files = [
    "*.LICENSE",
    "NOTICE",
    "AUTHORS.rst",
    "CHANGELOG.rst",
    "CODE_OF_CONDUCT.rst",
]

editable_paths = [ "src/commoncode/", "tests/commoncode/" ]

